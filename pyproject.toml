[project]
name = "dropbox-analyzer"
version = "0.1.0"
description = "Browse what is using space in your Dropbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dropbox>=12.2.4",
    "platformdirs>=4.14.5",
    "textual>=8.2.8",
]

[project.scripts]
dropbox-analyzer = "dropbox_analyzer.app:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
